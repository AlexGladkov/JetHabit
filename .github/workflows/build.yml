name: CI Build

on:
  pull_request:
    branches: [main]

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build JVM
        run: ./gradlew :composeApp:jvmJar --stacktrace
      - name: Test JVM
        run: ./gradlew :composeApp:jvmTest --stacktrace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Android
        run: ./gradlew :composeApp:assembleDebug --stacktrace

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build iOS
        run: ./gradlew :composeApp:linkDebugFrameworkIosX64 --stacktrace
